# Dapr Kafka Pub/Sub Component
# This template provides production-ready Kafka integration via Dapr

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default  # Change to your application namespace
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    # Broker configuration
    - name: brokers
      value: "kafka-cluster-kafka-bootstrap.kafka:9092"  # Update with your Kafka service

    # Consumer group configuration
    - name: consumerGroup
      value: "{appId}"  # Uses Dapr app-id, or set custom group name

    - name: clientID
      value: "{appId}"

    # Kafka version
    - name: version
      value: "3.9.0"  # Match your Kafka cluster version

    # Authentication (choose one)
    - name: authType
      value: "none"  # Options: none, password, mtls, oidc, awsiam

    # For SASL/PLAIN authentication (uncomment if using)
    # - name: authType
    #   value: "password"
    # - name: saslUsername
    #   value: "kafka-user"
    # - name: saslPassword
    #   secretKeyRef:
    #     name: kafka-secrets
    #     key: password

    # For mTLS authentication (uncomment if using Strimzi KafkaUser)
    # - name: authType
    #   value: "mtls"
    # - name: caCert
    #   secretKeyRef:
    #     name: your-kafka-user  # Generated by Strimzi
    #     key: ca.crt
    # - name: clientCert
    #   secretKeyRef:
    #     name: your-kafka-user
    #     key: user.crt
    # - name: clientKey
    #   secretKeyRef:
    #     name: your-kafka-user
    #     key: user.key

    # Consumer behavior
    - name: initialOffset
      value: "newest"  # or "oldest" for new consumer groups

    - name: consumeRetryEnabled
      value: "true"

    - name: consumeRetryInterval
      value: "100ms"

    # Timeouts
    - name: sessionTimeout
      value: "30s"

    - name: heartbeatInterval
      value: "10s"

    # Message size limit
    - name: maxMessageBytes
      value: "1048576"  # 1 MB

    # Performance tuning (optional)
    # - name: escapeHeaders
    #   value: "false"

---
# Example Subscription for task-events topic
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: default
spec:
  pubsubname: kafka-pubsub
  topic: task-events
  routes:
    default: /task-events  # Your application endpoint
  scopes:
    - recurring-task-service  # Dapr app-id that should receive these events
    - audit-service

---
# Example Subscription for task-reminders topic
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-reminders-subscription
  namespace: default
spec:
  pubsubname: kafka-pubsub
  topic: task-reminders
  routes:
    default: /reminders
  scopes:
    - notification-service
