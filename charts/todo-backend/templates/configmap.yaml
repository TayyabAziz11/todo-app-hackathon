apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-backend.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-backend.labels" . | nindent 4 }}
data:
  FRONTEND_URL: {{ .Values.configMap.FRONTEND_URL | quote }}
  {{- if .Values.configMap.CORS_ORIGINS }}
  CORS_ORIGINS: {{ .Values.configMap.CORS_ORIGINS | quote }}
  {{- end }}
  {{- if .Values.oauthRedirectUris.google }}
  GOOGLE_REDIRECT_URI: {{ .Values.oauthRedirectUris.google | quote }}
  {{- end }}
  {{- if .Values.oauthRedirectUris.github }}
  GITHUB_REDIRECT_URI: {{ .Values.oauthRedirectUris.github | quote }}
  {{- end }}
