{{- if .Values.createLocalSecret }}
# WARNING: This secret is for LOCAL DEVELOPMENT ONLY
# Never use this pattern in production
# In production, use external secret managers (Vault, Sealed Secrets, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.localSecrets.databaseUrl | quote }}
  SECRET_KEY: {{ .Values.localSecrets.secretKey | quote }}
  OPENAI_API_KEY: {{ .Values.localSecrets.openaiApiKey | quote }}
  {{- if .Values.localSecrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.localSecrets.googleClientId | quote }}
  {{- end }}
  {{- if .Values.localSecrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.localSecrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.localSecrets.githubClientId }}
  GITHUB_CLIENT_ID: {{ .Values.localSecrets.githubClientId | quote }}
  {{- end }}
  {{- if .Values.localSecrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: {{ .Values.localSecrets.githubClientSecret | quote }}
  {{- end }}
{{- end }}
