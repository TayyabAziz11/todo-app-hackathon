# This is a template for creating the todo-backend-secrets Secret.
# In production, secrets should be managed externally using:
# - Sealed Secrets
# - External Secrets Operator
# - Vault
# - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault)
#
# For development with Minikube, create the secret manually:
#
# kubectl create secret generic todo-backend-secrets \
#   --namespace=todo-dev \
#   --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/dbname' \
#   --from-literal=SECRET_KEY='your-secret-key-here' \
#   --from-literal=OPENAI_API_KEY='your-openai-api-key-here'
#
# Or use a secrets.yaml file (NOT checked into version control):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: todo-backend-secrets
#   namespace: todo-dev
# type: Opaque
# stringData:
#   DATABASE_URL: "postgresql://user:pass@host:5432/dbname"
#   SECRET_KEY: "your-secret-key-here"
#   OPENAI_API_KEY: "your-openai-api-key-here"
#
# Apply with: kubectl apply -f secrets.yaml
#
# IMPORTANT: Never commit actual secret values to version control!
