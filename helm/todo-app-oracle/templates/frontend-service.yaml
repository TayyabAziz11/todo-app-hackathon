apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-app-oracle.labels" . | nindent 4 }}
    {{- include "todo-app-oracle.frontendSelectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "todo-app-oracle.frontendSelectorLabels" . | nindent 4 }}
