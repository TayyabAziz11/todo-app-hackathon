# Minikube-specific overrides
# Use: helm install todo-app ./helm/todo-app -f helm/todo-app/values-minikube.yaml

global:
  namespace: todo-app-dev
  imagePullPolicy: IfNotPresent
  replicaCount: 1

# Reduced resource limits for local development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

# Faster health checks for local development
healthProbes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10

# Dapr log level for debugging
dapr:
  enabled: true
  logLevel: debug

# Service-specific Minikube configurations
services:
  todoService:
    enabled: true
    image:
      tag: v4.1  # Phase V.3 with Search + Reminders + Timezone fix
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"

  userService:
    enabled: true
    image:
      tag: v2  # Phase V.3 with Notification Preferences
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"

  chatService:
    enabled: true
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"

  notificationService:
    enabled: true
    image:
      tag: v2.1  # Phase V.3 with Email + DLQ Handler (T074)
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"

  auditService:
    enabled: true
    image:
      tag: v2  # Phase V.2 with F6 Audit Logging
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"

  analyticsService:
    enabled: true
    env:
      - name: ENV
        value: "development"
      - name: LOG_LEVEL
        value: "DEBUG"
